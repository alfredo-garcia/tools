<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Food — Prototipo 013 Atajos del detalle</title>
<style>
/* Tokens: ui_standards §2-§6 (same names as src/app/globals.css) */
:root{
  --color-bg:#15130F; --color-surface-1:#1F1C17; --color-surface-2:#2A2620; --color-border:#38332B;
  --color-text:#F6EFE4; --color-text-muted:#A99F90;
  --color-primary-500:#FF7A45; --color-primary-contrast:#15130F; --color-primary-soft:rgba(255,122,69,.16);
  --color-success-500:#7BD88F; --color-warning-500:#F2C14E; --color-danger-500:#FF6B6B; --color-lime:#B7E04A;
  --color-lime-soft:rgba(183,224,74,.16);
  --radius-sm:10px; --radius-md:18px; --radius-lg:28px; --radius-full:999px;
  --elevation-1:0 1px 2px rgba(0,0,0,.4); --elevation-3:0 18px 40px rgba(0,0,0,.55);
  --focus:0 0 0 3px rgba(255,122,69,.55);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dur:150ms;
}
:root[data-theme="light"]{
  --color-bg:#FBF7F1; --color-surface-1:#FFFFFF; --color-surface-2:#F3EDE3; --color-border:#E4DACB;
  --color-text:#1E1A14; --color-text-muted:#6B6254;
  --color-primary-500:#C2410C; --color-primary-contrast:#FFFFFF; --color-primary-soft:rgba(194,65,12,.1);
  --color-success-500:#2E7D32; --color-warning-500:#B7791F; --color-danger-500:#B42318; --color-lime:#4D7C0F;
  --color-lime-soft:rgba(77,124,15,.12);
  --elevation-1:0 1px 2px rgba(60,40,10,.12); --elevation-3:0 18px 40px rgba(60,40,10,.2); --focus:0 0 0 3px rgba(194,65,12,.4);
}
@media (prefers-reduced-motion:reduce){:root{--dur:0ms}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--color-bg);color:var(--color-text);font:400 16px/1.5 var(--font);display:flex;flex-direction:column}
button,a,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--focus)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.nav{width:24px;height:24px}
svg.i.sm{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Prototype-only toolbar */
.proto{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--color-surface-2);border-bottom:1px solid var(--color-border);font-size:12px;color:var(--color-text-muted)}
.proto b{color:var(--color-text)}
.proto .seg{display:inline-flex;border:1px solid var(--color-border);border-radius:var(--radius-full);overflow:hidden}
.proto .seg button{padding:4px 12px;font-size:12px;font-weight:600}
.proto .seg button[aria-pressed="true"]{background:var(--color-primary-500);color:var(--color-primary-contrast)}
.proto .act{padding:4px 12px;font-size:12px;font-weight:600;border:1px solid var(--color-border);border-radius:var(--radius-full)}
.proto .act[aria-pressed="true"]{background:var(--color-warning-500);color:var(--color-primary-contrast)}
.stage{flex:1;min-height:0;display:flex;justify-content:safe center;overflow:auto;background:var(--color-bg)}
.frame{position:relative;width:100%;overflow:hidden;background:var(--color-bg)}
.frame.fixed{flex:none;outline:1px solid var(--color-border);margin:12px 0;height:calc(100% - 24px);align-self:center}
.frame.phone{border:8px solid #000;border-radius:36px;max-height:820px}

/* App frame + navigation (feature 006) */
.app{position:absolute;inset:0;display:flex}
.content{position:relative;flex:1;min-width:0;display:flex}
.scroll{flex:1;min-width:0;overflow:auto}
.scroll.col{flex:none;width:400px;border-right:1px solid var(--color-border)}
.bottomnav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--color-surface-1);border-top:1px solid var(--color-border);z-index:5}
.bottomnav a{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px/1.3 var(--font);color:var(--color-text-muted);position:relative;cursor:pointer}
.bottomnav a[aria-current="page"]{color:var(--color-primary-500)}
.bottomnav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--color-primary-500)}
.sidenav{flex:none;display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--color-surface-1);border-right:1px solid var(--color-border);width:72px;overflow:hidden}
.sidenav.expanded{width:224px}
.sidenav .brand{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;font-weight:800;white-space:nowrap}
.sidenav a{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:var(--radius-full);font:600 14px/1.3 var(--font);color:var(--color-text-muted);white-space:nowrap;cursor:pointer}
.sidenav a[aria-current="page"]{background:var(--color-primary-soft);color:var(--color-primary-500)}
.sidenav:not(.expanded) .lbl,.sidenav:not(.expanded) .brand span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.soon{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--color-text-muted)}

/* Screens */
.shell{max-width:720px;margin:0 auto;padding:16px}
.col .shell{padding:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px}
.head h1{font:800 24px/1.15 var(--font);margin:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--color-text-muted)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--color-success-500)}
.badge.off i{background:var(--color-warning-500)}

/* TmpSegmentedControl (Perfil tab bar) */
.segc{display:flex;gap:4px;padding:4px;background:var(--color-surface-2);border-radius:var(--radius-full)}
.segc button{flex:1;min-height:44px;padding:0 12px;border-radius:var(--radius-full);font:600 14px/1.3 var(--font);color:var(--color-text-muted);white-space:nowrap}
.segc button[aria-selected="true"]{background:var(--color-surface-1);color:var(--color-text);box-shadow:var(--elevation-1);outline:2px solid var(--color-primary-500);outline-offset:-2px}

/* SearchInput */
.search{position:relative;margin-top:12px}
.search svg.lead{position:absolute;left:16px;top:14px;color:var(--color-text-muted)}
.search input{width:100%;height:48px;padding:0 48px 0 44px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);outline:none}
.search input:focus{box-shadow:var(--focus);border-color:var(--color-primary-500)}
.search .clr{position:absolute;right:2px;top:2px;width:44px;height:44px;border-radius:var(--radius-full);display:grid;place-items:center;color:var(--color-text-muted)}

/* FilterChip + FilterOptions */
.filters{display:flex;gap:8px;margin-top:12px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);font:600 14px/1.3 var(--font)}
.fchip.active{background:var(--color-primary-soft);border-color:var(--color-primary-500);color:var(--color-primary-500)}
.filters .count{margin-left:auto;font-size:12px;color:var(--color-text-muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-1)}
.opt{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:0 14px;border-radius:var(--radius-full);border:1px solid var(--color-border);font:600 14px/1.3 var(--font)}
.opt small{color:var(--color-text-muted);font-weight:500}
.opt[disabled]{opacity:.4;cursor:default}
.opt[aria-selected="true"]{background:var(--color-primary-soft);border-color:var(--color-primary-500);color:var(--color-primary-500)}

/* TmpPendingChanges */
.pending{display:flex;align-items:center;gap:8px;margin-top:12px;padding:6px 6px 6px 14px;border-radius:var(--radius-full);border:1px solid var(--color-warning-500);background:color-mix(in srgb,var(--color-warning-500) 14%,transparent);font:600 13px/1.3 var(--font)}
.pending span{flex:1}
.pending button{min-height:36px;padding:0 14px;border-radius:var(--radius-full);background:var(--color-warning-500);color:var(--color-primary-contrast);font:700 13px/1.3 var(--font)}

/* Recipe rows (RecipeLink + FavoriteButton) */
.list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.rrow{position:relative;display:flex;align-items:center;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-1);box-shadow:var(--elevation-1)}
.rrow.current{border-color:var(--color-primary-500);background:var(--color-primary-soft)}
.rrow.off .rlink{opacity:.5}
.rlink{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px;border-radius:var(--radius-md);text-align:left;cursor:pointer}
.photo{display:grid;place-items:center;flex:none;font-size:26px;background:linear-gradient(135deg,var(--color-surface-2),var(--color-primary-soft))}
.rlink .photo{width:56px;height:56px;border-radius:var(--radius-sm)}
.rlink .t{min-width:0}
.rlink .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlink .t small{color:var(--color-text-muted);font-size:12px}

/* FavoriteButton: icon variant (rows, detail title row) and labeled variant (under the photo) */
.fav{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:var(--radius-full);color:var(--color-text-muted)}
.fav svg{width:24px;height:24px}
.fav[aria-pressed="true"]{color:var(--color-lime)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.rrow .fav{margin-right:4px}
.fav.labeled{width:auto;height:auto;min-height:48px;display:inline-flex;gap:8px;padding:0 20px;border:1px solid var(--color-border);background:var(--color-surface-1);font:600 14px/1.3 var(--font);color:var(--color-text);border-radius:var(--radius-full)}
.fav.labeled svg{width:20px;height:20px}
.fav.labeled[aria-pressed="true"]{background:var(--color-lime-soft);border-color:var(--color-lime);color:var(--color-lime)}

/* Detail (DetailLayer: fullscreen / modal / panel) */
.layer{position:absolute;inset:0;z-index:20}
.layer.full{background:var(--color-bg)}
.layer.modal{background:rgba(0,0,0,.55);display:grid;place-items:center}
.layer.panel{position:relative;flex:1;min-width:0;inset:auto;z-index:auto}
.dcard{display:flex;flex-direction:column;background:var(--color-bg);width:100%;height:100%}
.layer.modal .dcard{width:min(720px,92%);height:90%;border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--elevation-3);overflow:hidden}
.dbar{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 8px;border-bottom:1px solid var(--color-border);background:var(--color-surface-1);flex:none}
.dbar .ttl{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbar button.b{min-height:44px;min-width:44px;padding:0 12px;border-radius:var(--radius-full);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dbody{flex:1;min-height:0;overflow:auto}
.dwrap{max-width:768px;margin:0 auto;padding-bottom:40px}
.dwrap .photo{width:100%;aspect-ratio:16/9;font-size:72px}
.dsec{padding:16px 16px 0}
.dbtn{padding:12px 16px 0}
.panel .dbtn{padding:12px 0 0}
.panel .dwrap{max-width:none;padding:16px 16px 40px;display:grid;grid-template-columns:2fr 3fr;column-gap:16px;align-items:start}
.panel .dphoto{grid-column:1;grid-row:1}
.panel .dphoto .photo{border-radius:var(--radius-md)}
.panel .dsec{display:contents}
.panel .dsec>section{grid-column:1/-1}
.panel .dsec>section.info{grid-column:2;grid-row:1;margin-top:0}
.info dl{display:grid;grid-template-columns:auto 1fr;column-gap:16px;margin:0}
.info dt{min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--color-text-muted)}
.info dd{min-height:44px;margin:0;display:flex;align-items:center;font-size:14px;font-weight:600}
.dsec section>h2{margin-top:20px}
.titlerow{display:flex;align-items:flex-start;gap:8px}
.titlerow h1{flex:1;min-width:0;margin:0;font:800 24px/1.15 var(--font);padding-top:8px}
.dsec h2{font:700 16px/1.3 var(--font);margin:20px 0 8px}
.dsec ul{margin:0;padding-left:20px;color:var(--color-text-muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips span{padding:4px 12px;border-radius:var(--radius-full);background:var(--color-surface-2);font-size:13px}

/* EmptyState, buttons */
.empty{text-align:center;padding:40px 16px;color:var(--color-text-muted)}
.empty .em{font-size:44px}
.empty h2{font:700 18px/1.25 var(--font);color:var(--color-text);margin:8px 0 4px}
.empty p{margin:0 0 16px}
.btn{min-height:48px;padding:0 20px;border-radius:var(--radius-full);font:700 14px/1.3 var(--font);border:1px solid var(--color-border);background:var(--color-surface-2);margin:0 4px}
.btn.primary{background:var(--color-primary-500);color:var(--color-primary-contrast);border-color:var(--color-primary-500)}
.pickhint{display:grid;place-items:center;flex:1;min-width:0}

/* Sheet (key dialog) and Toast */
.sheetlayer{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheetlayer.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:480px;background:var(--color-surface-1);padding:24px 16px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--elevation-3)}
.center .sheet{border-radius:var(--radius-lg)}
.sheet h2{margin:0 0 4px;font:700 18px/1.25 var(--font)}
.sheet p{margin:0 0 12px;color:var(--color-text-muted);font-size:14px}
.sheet input{width:100%;height:48px;padding:0 16px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);outline:none}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:40;max-width:90%;padding:10px 18px;border-radius:var(--radius-full);background:var(--color-surface-2);border:1px solid var(--color-danger-500);box-shadow:var(--elevation-3);font:600 14px/1.3 var(--font)}
.large .toast,.medium .toast{bottom:24px}

/* RatingStars (registry, Beta): 5 buttons, 44px targets; RatingMark: read-only mark on rows (feature 012) */
.stars{display:inline-flex;align-items:center}
.stars button{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--radius-full);color:var(--color-text-muted)}
.stars button svg{width:28px;height:28px;fill:none}
.stars button[aria-pressed="true"]{color:var(--color-warning-500)}
.stars button[aria-pressed="true"] svg{fill:currentColor}
.ratingrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ratingrow .cap{font-size:14px;color:var(--color-text-muted);font-weight:600}
.dsec .ratingrow{margin-top:4px}
.panel .dbtn,.dbtn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.dbtn .ratingrow{margin:0 0 0 -10px;flex-wrap:nowrap;white-space:nowrap}
.mark{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--color-warning-500)}
.mark svg{width:12px;height:12px;fill:currentColor;stroke:none}
.rlink .t small .sep{margin:0 6px;opacity:.6}
.filters{flex-wrap:wrap}
.opts .opt svg{width:12px;height:12px;fill:currentColor;stroke:none}
.fchip svg.st{width:12px;height:12px;fill:currentColor;stroke:none}
.plan h2{font:700 16px/1.3 var(--font);margin:20px 0 8px}
.plan h2 small{color:var(--color-text-muted);font-weight:500}
.slot{margin:0 0 12px}
.slot h3{margin:0 0 6px;font:700 13px/1.3 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)}
.slot .prow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-1);margin-bottom:8px;cursor:pointer}
.slot .prow .photo{width:56px;height:56px;border-radius:var(--radius-sm)}
.slot .prow b{display:block}
.slot .prow small{color:var(--color-text-muted);font-size:12px}

/* ---- Feature 013 ---- */
.btn[disabled]{opacity:.4;cursor:default}
.dact{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
.panel .dact,.dsec .dact,.dsec .dbtn{padding-left:0;padding-right:0}
.panel .dact{padding:12px 0 0}
.dact .btn{margin:0;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.small .dact .btn,.small .dbtn .fav.labeled{flex:1 1 100%;width:100%;justify-content:center}
.small .dbtn .ratingrow{margin-left:-10px}
/* Sheet content: header, scrolling body, actions (Sheet: title, subtitle?, hideClose?, size) */
.sheet{display:flex;flex-direction:column;max-height:88%}
.sheet.tall{height:88%}
.center .sheet.tall{height:min(640px,100%)}
.sheet .sh{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.sheet .sh>div{flex:1;min-width:0}
.sheet .sh h2{margin:0}
.sheet .sh small{display:block;color:var(--color-text-muted);font-size:12px}
.sheet .sh .x{width:44px;height:44px;border-radius:var(--radius-full);display:grid;place-items:center;color:var(--color-text-muted);margin:-8px -8px 0 0}
.sheet .body{overflow:auto;min-height:0;flex:1}
.sheet .acts{flex-wrap:wrap}
.sheet .acts .btn{flex:1;margin:0}
.grp{margin:0 0 12px}
.grp h3{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font:700 14px/1.3 var(--font)}
.grp h3 button{display:flex;align-items:center;gap:8px;min-height:44px;font:inherit;width:100%;text-align:left}
.grp h3 i{width:10px;height:10px;border-radius:3px;flex:none}
.grp.faltan h3 i{background:var(--color-warning-500)}
.grp.lista h3 i{background:var(--color-primary-500)}
.grp.tengo h3 i{background:var(--color-success-500)}
.grp ul{list-style:none;margin:0;padding:0}
.grp li{border-bottom:1px solid var(--color-border);padding:10px 4px;font-weight:600}
.grp.tengo li,.grp.lista li{font-weight:500;color:var(--color-text-muted)}
.grp li:last-child{border-bottom:0}
.sheet p.note{margin:0 0 8px}
/* Recipe picker rows */
.opts2{list-style:none;margin:8px 0 0;padding:0;overflow:auto;min-height:0;flex:1}
.opt2{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;padding:8px;border-radius:var(--radius-md);border:2px solid transparent;text-align:left}
.opt2:hover{background:var(--color-surface-2)}
.opt2[aria-selected="true"]{border-color:var(--color-primary-500);background:var(--color-primary-soft)}
.opt2 .photo{width:48px;height:48px;border-radius:var(--radius-sm);font-size:22px}
.opt2 .t{flex:1;min-width:0}
.opt2 .t b{display:block}
.opt2 .t small{color:var(--color-text-muted);font-size:12px}
.opt2 .ck{color:var(--color-primary-500);flex:none}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:var(--radius-full);background:var(--color-primary-500);color:var(--color-primary-contrast);font:700 11px/1.5 var(--font);vertical-align:middle}
.psearch{position:relative}
.psearch svg.lead{position:absolute;left:16px;top:14px;color:var(--color-text-muted)}
.psearch input{width:100%;height:48px;padding:0 16px 0 44px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);outline:none}
.pday h2{font:700 16px/1.3 var(--font);margin:20px 0 8px}
.pday h2 small{color:var(--color-text-muted);font-weight:500}
.slot .head2{display:flex;align-items:center;justify-content:space-between}
.slot .add{min-height:44px;padding:0 14px;border-radius:var(--radius-full);border:1px solid var(--color-border);font:600 13px/1.3 var(--font)}
.slot .empty2{color:var(--color-text-muted);font-size:13px;margin:0 0 8px}
.pan{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pan ul{margin:0;padding-left:20px}
.pan h2{font:700 16px/1.3 var(--font);margin:12px 0 4px}
.pan small{color:var(--color-text-muted)}
</style>
</head>
<body>
<div class="proto">
  <b>Prototipo my-food-manager/013 · Atajos del detalle</b>
  <span>Vista <span class="seg" id="tb-view"></span></span>
  <span>Tema <span class="seg" id="tb-theme"></span></span>
  <span>Conexión <span class="seg" id="tb-net"></span></span>
  <span>Clave <span class="seg" id="tb-key"></span></span>
  <button class="act" id="tb-reject" aria-pressed="false">Rechazar el próximo cambio</button>
  <button class="act" id="tb-reset">Reiniciar datos</button>
</div>
<div class="stage"><div class="frame" id="frame"></div></div>

<script>
/* ---------- data ---------- */
const CATS = {principal:"Platos principales", sopa:"Sopas y cremas", ensalada:"Ensaladas", postre:"Postres"};
const R = (id,t,c,e,time,status,rating,ings) => ({id,t,c,e,time,status,rating,ings});
const RECIPES = [
  R("ajiaco","Ajiaco bogotano","sopa","🍲","1 h 20 min","tried",5,["pollo","patata","mazorca","guascas","crema-de-leche","alcaparras","aguacate","cebolla","hierbas-del-huerto"]),
  R("arroz-con-pollo","Arroz con pollo y verduras al horno","principal","🍗","55 min","tried",4,["arroz","pollo","zanahoria","cebolla","aceite","sal"]),
  R("crema-pastelera","Crema pastelera","postre","🥛","15 min","tried",3,["leche","huevos","azucar","maicena"]),
  R("ensalada-de-quinoa","Ensalada de quinoa","ensalada","🥗","25 min","tried",null,["quinoa","tomate","aguacate","aceite","sal"]),
  R("flan","Flan de caramelo","postre","🍮","1 h","tried",3,[]),
  R("lentejas","Lentejas estofadas","sopa","🥣","50 min","tried",4,["lentejas","cebolla","zanahoria","aceite","sal"]),
  R("pasta-pesto","Pasta al pesto","principal","🍝","20 min","to-try",null,["pasta","albahaca","pinones","parmesano","ajo","aceite","sal"]),
  R("sopa-de-fideos","Sopa de fideos","sopa","🍜","25 min","discarded",null,["fideos","caldo","zanahoria","cebolla"]),
  R("tarta-de-cafe","Tarta de café","postre","☕","1 h 30 min","to-try",null,["cafe","harina","huevos","azucar","mantequilla"]),
  R("tiramisu","Tiramisú","postre","🍰","30 min","tried",2,["mascarpone","cafe","huevos","azucar"]),
  R("tortilla","Tortilla de patatas","principal","🍳","40 min","tried",5,["huevos","patata","cebolla","aceite","sal"]),
];
/* ingredient catalog: name + staple flag (ids missing here = not in the catalog) */
const CAT = {};
[["pollo","pollo"],["patata","patata"],["mazorca","mazorca"],["guascas","guascas"],["crema-de-leche","crema de leche"],["alcaparras","alcaparras"],["aguacate","aguacate"],["cebolla","cebolla"],["arroz","arroz"],["zanahoria","zanahoria"],["leche","leche"],["huevos","huevos"],["azucar","azúcar"],["maicena","maicena"],["quinoa","quinoa"],["tomate","tomate"],["lentejas","lentejas"],["pasta","pasta"],["albahaca","albahaca"],["pinones","piñones"],["parmesano","parmesano"],["ajo","ajo"],["fideos","fideos"],["caldo","caldo"],["cafe","café"],["harina","harina"],["mantequilla","mantequilla"],["mascarpone","mascarpone"]].forEach(([i,n])=>CAT[i]={n,staple:false});
[["aceite","aceite"],["sal","sal"]].forEach(([i,n])=>CAT[i]={n,staple:true});
const INIT = () => ({
  have:new Set(["cebolla","patata","huevos","ajo","azucar","harina"]),
  buy:new Set(["pasta","parmesano","guascas","ajo"]),      /* ajo: Tengo + Comprar → "Ya tengo" */
  plan:{d0:{breakfast:[],lunch:["ajiaco"],dinner:[]},d1:{breakfast:[],lunch:[],dinner:[]},d2:{breakfast:[],lunch:[],dinner:[]}},
});
const DAYS = [["d0","Hoy","lunes 2 de noviembre"],["d1","Mañana","martes 3 de noviembre"],["d2","","miércoles 4 de noviembre"]];
const MEALS = [["breakfast","Desayuno","al desayuno"],["lunch","Almuerzo","al almuerzo"],["dinner","Cena","a la cena"]];
const ICONS = {
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  back:'<path d="m12 19-7-7 7-7M19 12H5"/>',
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  jar:'<path d="M8 2h8M7 6h10v14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2Z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  pot:'<path d="M5 11h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3ZM3 11h18M9 4c0 1.5 1 1.5 1 3M14 4c0 1.5 1 1.5 1 3"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
};
const ic = (n,c="") => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const recipe = id => RECIPES.find(r=>r.id===id);

/* ---------- state ---------- */
const S = {
  view:"auto", theme:"dark", online:true, keyStored:true, rejectNext:false,
  ...INIT(),
  pending:[], section:"recipes", detail:null,
  suggest:null,          /* PRD FR-7/8: origin recipe id carried to the Plan until the picker opens once */
  picker:null,           /* {date, meal, origin, sel, q} */
  shop:null,             /* recipe id: modal "Añadir a lista de compra" */
  missing:null,          /* recipe id: sheet after planning */
  tengoOpen:false, wantKey:false,
  toast:null, keyDialog:false, keyDismissed:false, frameW:1280,
};
const layout = () => S.frameW < 640 ? "small" : S.frameW < 1280 ? "medium" : "large";

/* effective shopping list = stored + pending (shown at once) */
function buyNow(){ const b=new Set(S.buy); S.pending.forEach(o=>{ if(o.kind==="buy") o.value?b.add(o.id):b.delete(o.id); }); return b; }
function planNow(){
  const p=JSON.parse(JSON.stringify(S.plan));
  S.pending.forEach(o=>{ if(o.kind==="plan") p[o.date][o.meal].push(o.id); });
  return p;
}

/* PRD FR-2, FR-3: classification shared by the modal and the sheet after planning */
function classify(r){
  const buy=buyNow(), seen=new Set(), out={faltan:[],lista:[],tengo:[]};
  for (const id of r.ings){
    const e=CAT[id]; if(!e||seen.has(id)) continue; seen.add(id);
    if (e.staple || S.have.has(id)) out.tengo.push(id);
    else if (buy.has(id)) out.lista.push(id);
    else out.faltan.push(id);
  }
  return out;
}

/* ---------- outbox simulation ---------- */
function enqueue(ops){
  const reject=S.rejectNext; S.rejectNext=false; syncReject();
  ops.forEach(o=>{ o.reject=reject; S.pending.push(o); });
  if (!S.keyStored && !S.keyDismissed) S.wantKey=true;
  send(ops);
  render();
}
function send(ops){
  if (!S.online || !S.keyStored) return;
  setTimeout(()=>{
    ops.forEach(o=>{
      S.pending=S.pending.filter(p=>p!==o);
      if (o.reject) { S.toast=`No se pudo guardar ${o.label}`; setTimeout(()=>{S.toast=null;render()},4000); }
      else if (o.kind==="buy") o.value?S.buy.add(o.id):S.buy.delete(o.id);
      else S.plan[o.date][o.meal].push(o.id);
    });
    render();
  },700);
}
function flush(){ const ops=S.pending.filter(o=>!o.sent); ops.forEach(o=>o.sent=true); send(ops); }
/* the write key is asked only once every sheet is closed (spec: CMP-write-key) */
function maybeAskKey(){
  if (S.wantKey && !S.shop && !S.missing && !S.picker && !S.keyDialog) { S.keyDialog=true; S.wantKey=false; }
}
function addToList(ids){
  enqueue(ids.map(id=>({kind:"buy",id,value:true,label:cap(CAT[id].n)})));
}

/* ---------- components ---------- */
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS.star+'</svg>';
const mark = r => r.rating===null?"":`<span class="mark" aria-label="Rating ${r.rating} de 5">${STAR}${r.rating}</span>`;
function favBtn(r){ return `<button class="fav labeled" aria-pressed="false" data-act="noop">${ic("heart")}<span>Añadir a favoritos</span></button>`; }
function ratingRow(r){
  return `<div class="ratingrow"><span class="stars" role="group" aria-label="Rating de ${r.t}">${[1,2,3,4,5].map(n=>`<button data-act="noop" aria-pressed="${r.rating!==null&&n<=r.rating}" aria-label="${n} estrellas">${ic("star")}</button>`).join("")}</span><span class="cap">${r.rating===null?"Sin rating":r.rating+" de 5"}</span></div>`;
}
/* TmpDetailShortcuts: the two contextual buttons under the rating row */
function shortcuts(r){
  return `<div class="dact"><button class="btn" data-act="shop" data-id="${r.id}">${ic("cart")}Añadir a lista de compra</button><button class="btn" data-act="toplan" data-id="${r.id}">${ic("cal")}Añadir al plan</button></div>`;
}
function detail(r, mode){
  const full = mode==="full";
  const titleRow = full ? `<div class="titlerow"><h1>${r.t}</h1></div>${ratingRow(r)}<div class="dbtn">${favBtn(r)}</div>${shortcuts(r)}` : "";
  const btn = full ? "" : `<div class="dbtn">${ratingRow(r)}${favBtn(r)}</div>${shortcuts(r)}`;
  const head = full ? `<button class="b" data-act="close">${ic("back")}Atrás</button><span class="ttl"></span>`
    : `<span class="ttl" style="padding-left:8px">${r.t}</span><button class="b" data-act="close" aria-label="Cerrar">${ic("x")}</button>`;
  const info = `<section class="info"><h2>Info general</h2><dl><dt>Categoría</dt><dd>${CATS[r.c]}</dd><dt>Tiempo</dt><dd>${r.time}</dd><dt>Estado</dt><dd>${{tried:"Probada","to-try":"Por probar",discarded:"Descartada"}[r.status]}</dd></dl></section>`;
  const rest = `<section><h2>Ingredientes</h2><ul>${r.ings.length?r.ings.map(i=>`<li>${CAT[i]?CAT[i].n:i.replace(/-/g," ")}</li>`).join(""):"<li>Sin ingredientes</li>"}</ul></section><section><h2>Pasos</h2><ul><li>Paso uno</li><li>Paso dos</li></ul></section>`;
  return `<div class="layer ${mode}" ${mode==="modal"?'data-act="backdrop"':""}><div class="dcard" role="${mode==="panel"?"region":"dialog"}" aria-label="${r.t}">
    <div class="dbar">${head}</div><div class="dbody"><div class="dwrap">
    <div class="dphoto"><div class="photo">${r.e}</div>${btn}</div>
    <div class="dsec" ${full?'style="padding-top:8px"':""}>${titleRow}${info}${rest}</div>
    </div></div></div></div>`;
}

/* Sheet (registry): bottom sheet < 640 px, centered modal otherwise */
function sheet(L,{title,subtitle,body,acts,tall,hideClose,label}){
  return `<div class="sheetlayer ${L==="small"?"":"center"}" data-act="sheetbackdrop"><div class="sheet ${tall?"tall":""}" role="dialog" aria-label="${title}">
    <div class="sh"><div><h2>${title}</h2>${subtitle?`<small>${subtitle}</small>`:""}</div>${hideClose?"":`<button class="x" data-act="sheetclose" aria-label="${label||"Cerrar"}">${ic(label==="Atrás"?"back":"x")}</button>`}</div>
    <div class="body">${body}</div>${acts?`<div class="acts">${acts}</div>`:""}</div></div>`;
}
/* TmpIngredientGroups: Faltan / En mi lista de la compra / Ya tengo */
function groups(r){
  const g=classify(r), total=g.faltan.length+g.lista.length+g.tengo.length;
  if (!total) return {g,html:`<p class="note">Esta receta no tiene ingredientes del catálogo.</p>`};
  const list = ids => `<ul>${ids.map(i=>`<li>${cap(CAT[i].n)}</li>`).join("")}</ul>`;
  const collapsible = g.tengo.length>5;
  const open = !collapsible || S.tengoOpen;
  let html = "";
  if (!g.faltan.length) html += `<p class="note">No te falta nada: todo está en tu despensa o en tu lista.</p>`;
  if (g.faltan.length) html += `<section class="grp faltan"><h3><i></i>Faltan (${g.faltan.length})</h3>${list(g.faltan)}</section>`;
  if (g.lista.length) html += `<section class="grp lista"><h3><i></i>En mi lista de la compra (${g.lista.length})</h3>${list(g.lista)}</section>`;
  if (g.tengo.length) html += `<section class="grp tengo"><h3>${collapsible?`<button data-act="tengo" aria-expanded="${open}"><i></i>Ya tengo (${g.tengo.length})${ic("chev","sm")}</button>`:`<i></i>Ya tengo (${g.tengo.length})`}</h3>${open?list(g.tengo):""}</section>`;
  return {g,html};
}
function shopModal(L){
  const r=recipe(S.shop), {g,html}=groups(r);
  return sheet(L,{title:r.t,subtitle:"Lista de compra",label:"Atrás",body:html,
    acts:`<button class="btn" data-act="sheetclose">Cancelar</button><button class="btn primary" data-act="shopadd" ${g.faltan.length?"":"disabled"}>Añadir a la lista</button>`});
}
function missingSheet(L){
  const r=recipe(S.missing), {html}=groups(r);
  return sheet(L,{title:r.t,subtitle:"Añadida al plan",hideClose:true,body:`<p class="note">En tu despensa te faltan estos ingredientes:</p>`+html,
    acts:`<button class="btn" data-act="misscont">Continuar</button><button class="btn primary" data-act="missadd">Añadir a mi lista de la compra</button>`});
}
function pickerSheet(L){
  const p=S.picker, mealL=MEALS.find(m=>m[0]===p.meal), day=DAYS.find(d=>d[0]===p.date);
  const q=norm(p.q.trim()), applied=q.length>=3;
  const match = r => !applied || q.split(/\s+/).every(w=>norm(r.t).includes(w));
  /* PRD FR-8/9: origin first (even if Descartada); the rest exclude Descartadas, in the usual order */
  const org = p.origin ? recipe(p.origin) : null;
  const rest = RECIPES.filter(r=>r.status!=="discarded" && r.id!==p.origin).filter(match).sort((a,b)=>a.t.localeCompare(b.t,"es"));
  const list = [...(org&&match(org)?[org]:[]), ...rest];
  const body = `<div class="psearch">${ic("search","lead")}<input type="search" id="pq" value="${p.q}" placeholder="Buscar receta" aria-label="Buscar receta"></div>`
    + (list.length ? `<ul class="opts2" role="listbox" aria-label="Recetas">${list.map(r=>`<li><button class="opt2" role="option" aria-selected="${p.sel===r.id}" data-act="pick" data-id="${r.id}"><span class="photo">${r.e}</span><span class="t"><b>${r.t}${r.id===p.origin?'<span class="tag">Tu receta</span>':""}</b><small>${r.time}</small></span>${p.sel===r.id?ic("check","ck"):""}</button></li>`).join("")}</ul>`
      : `<div class="empty"><div class="em">🔎</div><h2>Sin resultados</h2><p>Prueba con otra búsqueda.</p></div>`);
  return sheet(L,{title:`Añadir ${mealL[2]}`,subtitle:`${day[1]?day[1]+" · ":""}${day[2]}`,tall:true,body:`<div style="display:flex;flex-direction:column;height:100%;min-height:0">${body}</div>`,
    acts:`<button class="btn primary" data-act="pickadd" ${p.sel?"":"disabled"}>Añadir receta</button>`});
}

/* ---------- screens ---------- */
function shell(title, inner){
  return `<div class="shell"><div class="head"><h1>${title}</h1><span class="badge ${S.online?"":"off"}"><i></i>${S.online?"Sincronizado":"Sin conexión"}</span></div>${inner}</div>`;
}
function pendingBlock(){
  if (!S.pending.length) return "";
  return `<div class="pending"><span>${S.pending.length} ${S.pending.length===1?"cambio pendiente":"cambios pendientes"}</span>${!S.keyStored?`<button data-act="key">Introducir clave</button>`:""}</div>`;
}
function recipesScreen(){
  const list=[...RECIPES].sort((a,b)=>(b.rating||0)-(a.rating||0)||a.t.localeCompare(b.t,"es"));
  return shell("Recetas", pendingBlock()+`<ul class="list">${list.map(r=>`<li class="rrow ${S.detail===r.id?"current":""}"><a class="rlink" data-act="open" data-id="${r.id}" tabindex="0" role="link"><span class="photo">${r.e}</span><span class="t"><b>${r.t}</b><small>${CATS[r.c]}${r.rating!==null?`<span class="sep">·</span>${mark(r)}`:""}${r.status!=="tried"?`<span class="sep">·</span>${r.status==="to-try"?"Por probar":"Descartada"}`:""}</small></span></a></li>`).join("")}</ul>`);
}
function planScreen(){
  const plan=planNow();
  return shell("Plan", pendingBlock()+DAYS.map(([d,rel,txt])=>`<div class="pday"><h2>${cap(txt)}${rel?` <small>· ${rel.toLowerCase()}</small>`:""}</h2>${MEALS.map(([m,name,to])=>{
    const ids=plan[d][m];
    return `<div class="slot"><div class="head2"><h3>${name}</h3><button class="add" data-act="add" data-d="${d}" data-m="${m}" aria-label="Añadir ${to}, ${txt}">Añadir</button></div>${ids.length?ids.map(id=>{const r=recipe(id);return `<div class="prow" data-act="open" data-id="${id}" role="link" tabindex="0"><span class="photo">${r.e}</span><span><b>${r.t}</b><small>${CATS[r.c]}${r.rating!==null?`<span class="sep"> · </span>${mark(r)}`:""}</small></span></div>`}).join(""):`<p class="empty2">Nada planeado</p>`}</div>`;}).join("")}</div>`).join(""));
}
function pantryScreen(){
  const buy=[...buyNow()].filter(i=>CAT[i]);
  return shell("Despensa", pendingBlock()+`<div class="pan"><div><h2>Lista de compra <small>(${buy.length})</small></h2>${buy.length?`<ul>${buy.map(i=>`<li>${cap(CAT[i].n)}${S.have.has(i)?" <small>· también en la despensa</small>":""}</li>`).join("")}</ul>`:"<p><small>Tu lista está vacía</small></p>"}</div><div><h2>Tengo <small>(${S.have.size})</small></h2><ul>${[...S.have].map(i=>`<li>${cap(CAT[i].n)}</li>`).join("")}</ul></div></div>`);
}

const NAV=[["recipes","Recetas","book"],["plan","Plan","cal"],["pantry","Despensa","jar"],["profile","Perfil","user"]];
function render(){
  const L=layout(), f=document.getElementById("frame");
  f.className="frame "+(S.view==="auto"?"":"fixed ")+(S.view==="phone"?"phone ":"")+L;
  maybeAskKey();
  const rec = S.detail?recipe(S.detail):null;
  const detMode = L==="small"?"full":"modal";
  let main;
  if (S.section==="recipes") main = L==="large"
    ? `<div class="scroll col" id="scr">${recipesScreen()}</div>${rec?detail(rec,"panel"):`<div class="pickhint"><div class="empty"><div class="em">🍽️</div><h2>Elige una receta</h2><p>Se abrirá aquí, sin perder la lista.</p></div></div>`}`
    : `<div class="scroll" id="scr">${recipesScreen()}</div>${rec?detail(rec,detMode):""}`;
  else if (S.section==="plan") main = `<div class="scroll" id="scr">${planScreen()}</div>${rec?detail(rec,detMode):""}`;
  else if (S.section==="pantry") main = `<div class="scroll" id="scr">${pantryScreen()}</div>`;
  else main = `<div class="scroll"><div class="soon">Próximamente</div></div>`;
  const hideNav = L==="small" && rec;
  const nav = L==="small"
    ? `<nav class="bottomnav" ${hideNav?"hidden":""}>${NAV.map(n=>`<a data-act="goto" data-s="${n[0]}" ${n[0]===S.section?'aria-current="page"':""}>${ic(n[2],"nav")}${n[1]}</a>`).join("")}</nav>`
    : `<nav class="sidenav ${L==="large"?"expanded":""}"><div class="brand">${ic("pot","nav")}<span>My Food</span></div>${NAV.map(n=>`<a data-act="goto" data-s="${n[0]}" ${n[0]===S.section?'aria-current="page"':""}>${ic(n[2],"nav")}<span class="lbl">${n[1]}</span></a>`).join("")}</nav>`;
  const focusPq = document.activeElement && document.activeElement.id==="pq";
  const scrollTop = document.getElementById("scr")?.scrollTop||0;
  const dbody = f.querySelector(".dbody")?.scrollTop||0;
  const overlay = S.picker ? pickerSheet(L) : S.missing ? missingSheet(L) : S.shop ? shopModal(L) : "";
  f.innerHTML = `<div class="app">${nav}<div class="content">${main}</div></div>${overlay}
    ${S.keyDialog&&!overlay?`<div class="sheetlayer ${L==="small"?"":"center"}"><div class="sheet" role="dialog"><h2>Clave de escritura</h2><p>La necesitas una vez por dispositivo para guardar cambios.</p><input id="keyin" type="password" placeholder="Clave"><div class="acts"><button class="btn" data-act="keycancel">Ahora no</button><button class="btn primary" data-act="keysave">Guardar clave</button></div></div></div>`:""}
    ${S.toast?`<div class="toast" role="status">${S.toast}</div>`:""}`;
  const sc=document.getElementById("scr"); if(sc) sc.scrollTop=scrollTop;
  const db=f.querySelector(".dbody"); if(db) db.scrollTop=dbody;
  if (focusPq){ const el=document.getElementById("pq"); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);} }
}

/* ---------- events ---------- */
const frame=document.getElementById("frame");
function closeOverlays(){ S.shop=null; S.missing=null; S.picker=null; S.tengoOpen=false; }
frame.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if ((a==="backdrop"||a==="sheetbackdrop") && e.target!==t) return;
  if (a==="open"){ S.detail=t.dataset.id; render(); }
  else if (a==="close" || a==="backdrop"){ S.detail=null; render(); }
  else if (a==="goto"){ S.section=t.dataset.s; S.detail=null; S.suggest=null; render(); }
  else if (a==="shop"){ S.shop=t.dataset.id; S.tengoOpen=false; render(); }
  else if (a==="tengo"){ S.tengoOpen=!S.tengoOpen; render(); }
  else if (a==="shopadd"){ const g=classify(recipe(S.shop)); closeOverlays(); addToList(g.faltan); }
  else if (a==="sheetclose" || a==="sheetbackdrop"){
    if (S.missing) { closeOverlays(); } else closeOverlays();
    S.picker=null; render();
  }
  else if (a==="toplan"){ S.suggest=t.dataset.id; S.section="plan"; S.detail=null; render(); }       /* FR-7: also in place when the layer is over the Plan */
  else if (a==="add"){
    const org = S.suggest && recipe(S.suggest) ? S.suggest : null;   /* FR-8, FR-10 */
    S.picker={date:t.dataset.d,meal:t.dataset.m,origin:org,sel:org,q:""};
    S.suggest=null;                                                  /* AC-2.5: only the first opening */
    render();
  }
  else if (a==="pick"){ S.picker.sel = S.picker.sel===t.dataset.id ? null : t.dataset.id; render(); }
  else if (a==="pickadd"){
    const {date,meal,sel}=S.picker; closeOverlays();
    enqueue([{kind:"plan",date,meal,id:sel,label:recipe(sel).t}]);
    if (classify(recipe(sel)).faltan.length) S.missing=sel;
    render();
  }
  else if (a==="misscont"){ closeOverlays(); render(); }
  else if (a==="missadd"){ const g=classify(recipe(S.missing)); closeOverlays(); addToList(g.faltan); }
  else if (a==="key"){ S.keyDialog=true; render(); }
  else if (a==="keycancel"){ S.keyDialog=false; S.keyDismissed=true; render(); }
  else if (a==="keysave"){ S.keyStored=true; S.keyDialog=false; syncToolbar(); render(); flush(); }
});
frame.addEventListener("input",e=>{ if(e.target.id==="pq"){ S.picker.q=e.target.value; render(); } });
document.addEventListener("keydown",e=>{
  if (e.key!=="Escape") return;
  if (S.shop||S.picker||S.missing){ closeOverlays(); render(); }
  else if (S.detail&&layout()!=="large"){ S.detail=null; render(); }
});

/* ---------- toolbar ---------- */
function seg(id,items,get,set){
  const el=document.getElementById(id);
  el.innerHTML=items.map(([v,l])=>`<button data-v="${v}" aria-pressed="${get()===v}">${l}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button"); if(!b) return; set(b.dataset.v); syncToolbar(); measure(); render();};
}
function syncToolbar(){
  seg("tb-view",[["auto","Automática"],["phone","Móvil 390"],["medium","Medio 820"],["large","Grande 1280"]],()=>S.view,v=>S.view=v);
  seg("tb-theme",[["dark","Oscuro"],["light","Claro"]],()=>S.theme,v=>{S.theme=v;document.documentElement.dataset.theme=v;});
  seg("tb-net",[["on","En línea"],["off","Sin conexión"]],()=>S.online?"on":"off",v=>{S.online=v==="on"; if(S.online) flush();});
  seg("tb-key",[["yes","Guardada"],["no","Sin clave"]],()=>S.keyStored?"yes":"no",v=>{S.keyStored=v==="yes"; if(S.keyStored) flush(); else S.keyDismissed=false;});
  document.getElementById("tb-reject").setAttribute("aria-pressed",S.rejectNext);
}
function syncReject(){ document.getElementById("tb-reject").setAttribute("aria-pressed",S.rejectNext); }
document.getElementById("tb-reject").onclick=()=>{S.rejectNext=!S.rejectNext;syncReject();};
document.getElementById("tb-reset").onclick=()=>{Object.assign(S,INIT(),{pending:[],detail:null,suggest:null,picker:null,shop:null,missing:null,wantKey:false,section:"recipes"});render();};
function measure(){
  const widths={phone:390,medium:820,large:1280};
  const st=document.querySelector(".stage");
  frame.style.width = S.view==="auto" ? "" : widths[S.view]+"px";
  S.frameW = S.view==="auto" ? st.clientWidth : widths[S.view];
}
window.addEventListener("resize",()=>{measure();render();});
syncToolbar(); measure(); render();
</script>
</body>
