 flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DASH='<span class="dash" aria-label="sin dato">-</span>';
const fmtMin=m=>m<60?`${m} min`:(m%60?`${Math.floor(m/60)} h ${m%60} min`:`${m/60} h`);
const fmtNum=n=>String(Math.round(n*100)/100).replace('.',',');
const totalTime=t=>t&&(t.prep||t.cook||t.rest)?(t.prep||0)+(t.cook||0)+(t.rest||0):null;
const humanize=s=>{const t=s.replace(/-/g,' ');return t[0].toUpperCase()+t.slice(1)};
const tagLabel=(f,id)=>(TAGS[f]&&TAGS[f][id])||id;

/* RecipePhoto (registry): Drive photo or category tile */
function photo(r,cls){
  if(r.photo) return `<div class="photo ${cls}" style="background:linear-gradient(135deg,#8a4b2a,#e0a458 55%,#f6efe4)" role="img" aria-label="Foto simulada"><span class="emo" style="opacity:.9">🍮</span></div>`;
  const tint=`var(--cat-${r.category})`;
  return `<div class="photo ${cls}" aria-hidden="true" style="background:linear-gradient(135deg,color-mix(in srgb,${tint} 55%,var(--color-surface-2)),color-mix(in srgb,${tint} 18%,var(--color-surface-1)))"><span class="emo">${EMOJI[r.category]||'🍴'}</span></div>`;
}

/* TmpSection: collapsible section with chevron (state kept only while the detail is open) */
function section(id,title,body){
  return `<section class="sec" data-sec="${id}"><h2><button id="b-${id}" aria-expanded="true" aria-controls="p-${id}">${title}${ic('down','chev')}</button></h2>
  <div class="panel" id="p-${id}" role="region" aria-labelledby="b-${id}"><div><div class="inner">${body}</div></div></div></section>`;
}

function ingLine(l){
  const [ing,qty,unit,note,,link]=l;
  let q;
  if(unit==='to-taste'||unit==='as-needed'||unit==='pinch') q=qty==null?'':fmtNum(qty);
  else q=qty==null?'-':fmtNum(qty);
  const u=unit&&unit!=='to-taste'&&unit!=='as-needed'&&unit!=='pinch'?UNITS[unit]||unit:'';
  const name=ING[ing]||ing;
  const unmeasured=unit==='to-taste'||unit==='as-needed'||unit==='pinch';
  const left=unmeasured?'':`<span class="q">${q==='-'?DASH:esc(q+(u?' '+u:''))}</span>`;
  const label=link&&byId[link]?`<a href="#/recipes/${link}">${esc(name)}${ic('right','sm')}</a>`:esc(name);
  const tail=[unmeasured?UNITS[unit]:'',note].filter(Boolean).join(' · ');
  const opt=l.optional?'<span class="tag">opcional</span>':'';
  return `<li>${left||'<span class="q"></span>'}<span class="n">${label}${tail?` <small>${unmeasured?'':'· '}${esc(tail)}</small>`:''}${opt}</span></li>`;
}

function ingredientsBody(r){
  if(!r.ing.length) return DASH;
  const groups=[];const seen={};
  r.ing.forEach(l=>{const g=l[4]||'';if(!(g in seen)){seen[g]=[];groups.push(g)}seen[g].push(l)});
  groups.sort((a,b)=>(a===''?-1:0)-(b===''?-1:0));
  return groups.map(g=>`${g?`<h3 class="grp">${esc(humanize(g))}</h3>`:''}<ul class="ing">${seen[g].map(ingLine).join('')}</ul>`).join('');
}

function infoBody(r){
  const tt=totalTime(r.time),t=r.time||{};
  const chips=a=>a.length?`<div class="chips">${a.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:DASH;
  const cat=r.category&&r.category!=='unclassified'?`<span class="chip cat" style="background:var(--cat-${r.category})">${esc(CATS[r.category])}</span>`:DASH;
  const rows=[
   ['Categoría',cat],
   ['Tiempo',`<button class="timebtn" id="timebtn" aria-expanded="false" aria-controls="tbreak" ${tt?'':'disabled'}><span>${tt?fmtMin(tt):DASH}</span><span class="chev">${tt?ic('down','sm'):''}</span></button>`],
   ['__time',`<div class="breakdown" id="tbreak"><div><dl><dt>Preparación</dt><dd>${t.prep?fmtMin(t.prep):'-'}</dd><dt>Cocción</dt><dd>${t.cook?fmtMin(t.cook):'-'}</dd><dt>Reposo</dt><dd>${t.rest?fmtMin(t.rest):'-'}</dd></dl></div></div>`],
   ['Dificultad',r.difficulty?`${ic('flame','sm')}&nbsp;${DIFF[r.difficulty]}`:DASH],
   ['Raciones',r.servings&&r.servings.qty!=null?esc(fmtNum(r.servings.qty)+' '+(SERV[r.servings.unit]||r.servings.unit||'')):DASH],
   ['Técnica',chips((r.tags.technique||[]).map(x=>tagLabel('technique',x)))],
   ...Object.keys(FAM).map(f=>[FAM[f],chips(((r.tags&&r.tags[f])||[]).map(x=>tagLabel(f,x)))])
  ];
  return `<dl class="info">${rows.map(([k,v])=>k==='__time'?`<dd class="sub">${v}</dd>`:`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

function notesBody(r){
  const parts=[];
  if(r.notes.length) parts.push(`<h3>Notas</h3><ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`);
  if(r.variations) parts.push(`<h3>Variaciones</h3><p>${esc(r.variations)}</p>`);
  if(r.source){const s=r.source;const txt=[SRC[s.type]||s.type,s.author].filter(Boolean).join(' · ');
    parts.push(`<h3>Fuente</h3><p>${esc(txt)}${s.url?` ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Abrir enlace ${ic('ext','sm')}</a>`:''}`:''}</p>`)}
  return parts.join('');
}

function detailHTML(r){
  const tt=totalTime(r.time);
  const cat=`<span class="chip cat" style="background:var(--cat-${r.category})">${esc(CATS[r.category]||'Sin clasificar')}</span>`;
  const techs=(r.tags.technique||[]);
  const sections=[section('info','Info general',infoBody(r)),section('ing','Ingredientes',ingredientsBody(r)),
    section('steps','Pasos',r.steps.length?`<ol class="steps">${r.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>`:DASH)];
  const nb=notesBody(r);if(nb)sections.push(section('notes','Notas',`<div class="notes">${nb}</div>`));
  return `
  <div class="bar" id="bar"><button class="iconbtn back" data-act="back" aria-label="Atrás">${ic('left')}Atrás</button>
    <div class="ttl" aria-hidden="true">${esc(r.title)}</div>
    <button class="iconbtn closebtn" data-act="back" aria-label="Cerrar">${ic('x')}</button></div>
  <div class="body" id="body"><div class="content">
    <div class="hero">${photo(r,'hero')}</div>
    <div class="head"><h1 id="dtitle">${esc(r.title)}</h1>
</div>
    ${sections.join('')}
  </div></div>`;
}

/* ---------- App ---------- */
const frame=document.getElementById('frame');
let view='auto',cameDirect=false,pushes=0,loading=false;
frame.innerHTML=`<div class="page" id="page"><div class="shell"><h1>Recetas</h1><p class="count">${R.length} recetas</p>
 <ul class="list">${R.map(r=>`<li><a class="row" href="#/recipes/${r.id}" data-row="${r.id}" style="text-decoration:none;color:inherit">${photo(r,'sm')}<div class="meta"><div class="t">${esc(r.title)}</div><div class="c">${esc(CATS[r.category])}</div></div></a></li>`).join('')}</ul></div></div>
 <div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle" id="sheet"></div></div>`;
const ov=document.getElementById('ov'),sheet=document.getElementById('sheet'),page=document.getElementById('page');
let lastRow=null;

function route(){
  const m=location.hash.match(/^#\/recipes\/(.+)$/);
  if(!m){close();return}
  const id=decodeURIComponent(m[1]);
  ov.classList.add('open');page.inert=true;
  if(loading){sheet.innerHTML=`<div class="bar"><button class="iconbtn back" data-act="back" aria-label="Atrás">${ic('left')}Atrás</button><button class="iconbtn closebtn" data-act="back" aria-label="Cerrar">${ic('x')}</button></div><div class="state"><div class="spin"></div><p>Cargando tu receta…</p></div>`;return}
  const r=byId[id];
  if(!r){sheet.innerHTML=`<div class="bar"><button class="iconbtn back" data-act="back" aria-label="Atrás">${ic('left')}Atrás</button><button class="iconbtn closebtn" data-act="back" aria-label="Cerrar">${ic('x')}</button></div><div class="state"><div class="emo">🔍</div><h2 id="dtitle">Receta no encontrada</h2><p>Puede que se haya borrado de Drive.</p><button class="btn" data-act="list">Volver a recetas</button></div>`;return}
  sheet.innerHTML=detailHTML(r);
  const body=document.getElementById('body'),bar=document.getElementById('bar');
  body.addEventListener('scroll',()=>bar.classList.toggle('scrolled',body.scrollTop>56*1.5+ (frame.classList.contains('desktop')?0:60)),{passive:true});
  body.focus&&body.setAttribute('tabindex','-1');
  sheet.querySelector('[data-act="back"]:not([style*="none"])');
  setTimeout(()=>{const b=sheet.querySelector(frame.classList.contains('desktop')?'.closebtn':'.back');b&&b.focus()},0);
}
function close(){ov.classList.remove('open');page.inert=false;sheet.innerHTML='';if(lastRow){lastRow.focus();lastRow=null}}
function goBack(){ if(cameDirect&&pushes===0){location.replace('#/');cameDirect=false} else {pushes=Math.max(0,pushes-1);history.back()} }

window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const row=e.target.closest('[data-row]');if(row){lastRow=row;pushes++;return}
  const link=e.target.closest('.ing a[href^="#/recipes"]');if(link){pushes++;return}
  const act=e.target.closest('[data-act]');
  if(act){ if(act.dataset.act==='back')goBack(); else{location.hash='#/';} return}
  const tb=e.target.closest('#timebtn');
  if(tb&&!tb.disabled){const open=tb.getAttribute('aria-expanded')!=='true';tb.setAttribute('aria-expanded',open);document.getElementById('tbreak').classList.toggle('open',open);return}
  const sb=e.target.closest('.sec>h2>button');
  if(sb){const open=sb.getAttribute('aria-expanded')!=='true';sb.setAttribute('aria-expanded',open);document.getElementById('p-'+sb.parentElement.parentElement.dataset.sec).classList.toggle('closed',!open);return}
  if(e.target===ov&&frame.classList.contains('desktop'))goBack();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('open')&&frame.classList.contains('desktop'))goBack();
  if(e.key==='Tab'&&ov.classList.contains('open')){const f=[...sheet.querySelectorAll('button:not([disabled]),a[href]')].filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

/* Toolbar: view + theme */
function applyView(){
  frame.classList.toggle('phone',view==='phone');
  const w=view==='phone'?390:frame.clientWidth;
  frame.classList.toggle('desktop',view==='desk'||(view==='auto'&&window.innerWidth>=1024));
  document.querySelectorAll('#seg-view button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  if(ov.classList.contains('open'))route();
}
document.getElementById('seg-view').addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;applyView()}});
document.getElementById('seg-theme').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.dataset.theme=b.dataset.t;document.querySelectorAll('#seg-theme button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
document.getElementById('lnk-loading').addEventListener('click',e=>{e.preventDefault();loading=true;location.hash='#/recipes/'+R[0].id;setTimeout(()=>{loading=false;route()},1600)});
window.addEventListener('resize',()=>{if(view==='auto')applyView()});

/* Direct open: opened on a recipe address (no in-app history) */
cameDirect=/^#\/recipes\//.test(location.hash);
applyView();route();
</script>
</body>
</html>
