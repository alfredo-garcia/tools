# Reserva automática de clases Smart. Ver apps/smart-english-class-booking/README.md
name: Smart English class booking

on:
  schedule:
    # Lunes (reserva el martes) y miércoles (reserva el jueves), hora Bogotá = UTC-5:
    # 05:40, 07:00, 11:00 y 14:00. GitHub puede retrasar o saltarse un cron, así que hay
    # varios intentos; el script es idempotente. El de las 05:40 espera hasta las 06:00:00.
    - cron: "40 10 * * 1,3"
    - cron: "0 12 * * 1,3"
    - cron: "0 16 * * 1,3"
    - cron: "0 19 * * 1,3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = todo menos Confirmar"
        default: "1"
      target_date:
        description: "Forzar día dd/mm/yy (vacío = mañana)"
        default: ""
      wait_until:
        description: "HH:MM Bogotá: esperar hasta esa hora antes de reservar (vacío = no esperar)"
        default: ""
      quiet:
        description: "1 = sin aviso por Telegram si no había nada que hacer"
        default: "0"
      slots:
        description: "Solo reservar estos slots, separados por coma (07:30, 09:00, 10:30). Vacío = los tres"
        default: ""
      cancelar:
        description: "1 = en vez de reservar, cancelar las clases (no quizzes) del día objetivo"
        default: "0"

concurrency:
  group: smart-english-class-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-24.04  # fijo: Playwright 1.47 no soporta oficialmente las Ubuntu más nuevas (ubuntu-latest ya es la 26.04)
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/smart-english-class-booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/smart-english-class-booking/requirements.txt
      - run: pip install -r requirements.txt
      # Sin --with-deps: apt falla a veces (los runners no resuelven los mirrors de Ubuntu) y las
      # librerías de Chromium ya vienen en la imagen. Solo si el navegador no arranca se instalan.
      - run: python -m playwright install chromium
      - name: Comprobar que Chromium arranca (si no, instalar dependencias)
        run: >
          python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"
          || python -m playwright install-deps chromium
      - name: Reservar
        env:
          SMART_USER: ${{ secrets.SMART_USER }}
          SMART_PASS: ${{ secrets.SMART_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # En schedule no hay inputs: DRY_RUN queda en '0' (reserva real).
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          TARGET_DATE: ${{ inputs.target_date }}
          # Los runs programados (o disparados desde fuera con wait_until/quiet) esperan hasta las
          # 06:00 y no avisan si no había nada que hacer (ya reservado / quiz).
          WAIT_UNTIL: ${{ inputs.wait_until || (github.event_name == 'schedule' && '06:00' || '') }}
          ONLY_SLOTS: ${{ inputs.slots }}
          CANCEL: ${{ inputs.cancelar || '0' }}
          QUIET_IF_NOOP: ${{ (github.event_name == 'schedule' || inputs.quiet == '1') && '1' || '0' }}
          SHOTS_DIR: shots
        run: python booker.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/smart-english-class-booking/shots/*.png
          if-no-files-found: ignore
          retention-days: 7
