<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Food — Prototipo 006 Navegación principal</title>
<style>
/* Tokens: ui_standards §2-§6 (same names as src/app/globals.css) */
:root{
  --color-bg:#15130F; --color-surface-1:#1F1C17; --color-surface-2:#2A2620; --color-border:#38332B;
  --color-text:#F6EFE4; --color-text-muted:#A99F90;
  --color-primary-500:#FF7A45; --color-primary-contrast:#15130F; --color-primary-soft:rgba(255,122,69,.16);
  --cat-mains:#FF7A45; --cat-soups:#E0A458; --cat-salads:#7BD88F; --cat-desserts:#F58FB5; --cat-breakfast:#F2C14E;
  --color-success-500:#7BD88F;
  --radius-sm:10px; --radius-md:18px; --radius-lg:28px; --radius-full:999px;
  --elevation-1:0 1px 2px rgba(0,0,0,.4); --elevation-3:0 18px 40px rgba(0,0,0,.55);
  --focus:0 0 0 3px rgba(255,122,69,.55);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dur:200ms;
}
:root[data-theme="light"]{
  --color-bg:#FBF7F1; --color-surface-1:#FFFFFF; --color-surface-2:#F3EDE3; --color-border:#E4DACB;
  --color-text:#1E1A14; --color-text-muted:#6B6254;
  --color-primary-500:#C2410C; --color-primary-contrast:#FFFFFF; --color-primary-soft:rgba(194,65,12,.1);
  --color-success-500:#2E7D32;
  --elevation-1:0 1px 2px rgba(60,40,10,.12); --elevation-3:0 18px 40px rgba(60,40,10,.2); --focus:0 0 0 3px rgba(194,65,12,.4);
}
@media (prefers-reduced-motion:reduce){:root{--dur:0ms}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--color-bg);color:var(--color-text);font:400 16px/1.5 var(--font);display:flex;flex-direction:column}
button,a{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--focus)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.nav{width:24px;height:24px}

/* Prototype-only toolbar */
.proto{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--color-surface-2);border-bottom:1px solid var(--color-border);font-size:12px;color:var(--color-text-muted)}
.proto b{color:var(--color-text)}
.proto .seg{display:inline-flex;border:1px solid var(--color-border);border-radius:var(--radius-full);overflow:hidden}
.proto .seg button{padding:4px 12px;font-size:12px;font-weight:600}
.proto .seg button[aria-pressed="true"]{background:var(--color-primary-500);color:var(--color-primary-contrast)}
.proto code{background:var(--color-surface-1);padding:2px 8px;border-radius:var(--radius-full);color:var(--color-text)}
.stage{flex:1;min-height:0;display:flex;justify-content:safe center;overflow:auto;background:var(--color-bg)}
.frame{position:relative;width:100%;overflow:hidden;background:var(--color-bg);container-type:inline-size}
.frame.fixed{flex:none;outline:1px solid var(--color-border);margin:12px 0;height:calc(100% - 24px);align-self:center}
.frame.phone{border:8px solid #000;border-radius:36px;max-height:820px}

/* App: nav + content (CMP-app-frame). Layout classes are set from the frame width: small <640, medium 640-1279, large >=1280 */
.app{position:absolute;inset:0;display:flex}
.content{position:relative;flex:1;min-width:0;display:flex}
.scroll{flex:1;min-width:0;overflow:auto}
.shell{max-width:720px;margin:0 auto;padding:16px}
.shell h1{font:800 24px/1.15 var(--font);margin:8px 0 4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--color-text-muted)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--color-success-500)}
.list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:8px;background:var(--color-surface-1);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--elevation-1)}
.row[aria-current="true"]{border-color:var(--color-primary-500);background:var(--color-primary-soft)}
.thumb{width:56px;height:42px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:22px}
.row .t{font-weight:600}.row .c{font-size:12px;color:var(--color-text-muted)}

/* Large: list column + detail panel */
.large .listcol{flex:none;width:400px;border-right:1px solid var(--color-border)}
.large .listcol .shell{max-width:none}
.panel{flex:1;min-width:0;overflow:auto;border-left:0}
.panel .empty{height:100%;display:grid;place-items:center;color:var(--color-text-muted);text-align:center;padding:24px}

/* Nav: bottom bar (small) / sidebar (medium+large) */
.bottomnav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--color-surface-1);border-top:1px solid var(--color-border);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.bottomnav a{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px/1.3 var(--font);color:var(--color-text-muted);position:relative}
.bottomnav a[aria-current="page"]{color:var(--color-primary-500)}
.bottomnav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--color-primary-500)}
.bottomnav a[aria-current="page"] svg{stroke-width:2.6}
.sidenav{flex:none;display:flex;flex-direction:column;gap:4px;padding:12px 12px;background:var(--color-surface-1);border-right:1px solid var(--color-border);width:72px;transition:width var(--dur) ease-out;overflow:hidden}
.sidenav.expanded{width:224px}
.sidenav .brand{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;font-weight:800;white-space:nowrap}
.sidenav .brand img{width:32px;height:32px;border-radius:8px;flex:none}
.sidenav .brand span{overflow:hidden}
.sidenav a{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:var(--radius-full);font:600 14px/1.3 var(--font);color:var(--color-text-muted);white-space:nowrap}
.sidenav a:hover{background:var(--color-surface-2);color:var(--color-text)}
.sidenav a[aria-current="page"]{background:var(--color-primary-soft);color:var(--color-primary-500)}
.sidenav a[aria-current="page"] svg{stroke-width:2.6}
.sidenav .lbl{overflow:hidden}
.sidenav:not(.expanded) .lbl,.sidenav:not(.expanded) .brand span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sidenav .grow{flex:1}
.sidenav .toggle{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:var(--radius-full);color:var(--color-text-muted);font:600 14px/1.3 var(--font);white-space:nowrap}
.sidenav .toggle:hover{background:var(--color-surface-2);color:var(--color-text)}

/* TmpComingSoon */
.soon{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.soon .ic{width:72px;height:72px;margin:0 auto 16px;display:grid;place-items:center;border-radius:var(--radius-full);background:var(--color-surface-2);color:var(--color-text-muted)}
.soon .ic svg{width:32px;height:32px}
.soon h1{margin:0 0 4px;font:800 24px/1.15 var(--font)}
.soon p{margin:0;color:var(--color-text-muted)}

/* Detail: full screen (small), modal (medium), panel (large) */
.detail{background:var(--color-bg)}
.detail .bar{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:8px 8px;background:var(--color-bg);border-bottom:1px solid var(--color-border);z-index:2}
.detail .bar b{font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:var(--radius-full);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--color-surface-2)}
.detail .body{padding:16px;max-width:720px;margin:0 auto}
.detail .hero{height:160px;border-radius:var(--radius-md);display:grid;place-items:center;font-size:56px;margin-bottom:16px}
.detail h2{font:700 18px/1.25 var(--font);margin:16px 0 8px}
.detail p,.detail li{color:var(--color-text-muted)}
.layer{position:absolute;inset:0;z-index:10}
.layer.full{background:var(--color-bg);overflow:auto}
.layer.modal{background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px}
.layer.modal .detail{width:min(720px,100%);max-height:100%;overflow:auto;border-radius:var(--radius-lg);box-shadow:var(--elevation-3)}
.layer.modal .detail .bar{border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.note{margin:16px 0 0;padding:12px;border:1px dashed var(--color-border);border-radius:var(--radius-md);font-size:12px;color:var(--color-text-muted)}
</style>
</head>
<body>
<div class="proto" role="toolbar" aria-label="Controles del prototipo">
  <b>Prototipo 006 · Navegación principal</b>
  <span>Vista:</span>
  <span class="seg" id="views"></span>
  <span>Tema:</span>
  <span class="seg" id="themes"></span>
  <span>Dirección: <code id="addr">/</code></span>
  <span id="info"></span>
  <button id="resetpref" style="text-decoration:underline">Borrar preferencia del menú</button>
</div>
<div class="stage"><div class="frame" id="frame"><div class="app" id="app"></div></div></div>

<script>
const ICONS={
  chef:'<path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/>',
  cal:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>',
  fridge:'<path d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/><path d="M5 10h14"/><path d="M15 7v6"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  close:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>',
  open:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  back:'<path d="m15 18-6-6 6-6"/>'
};
const svg=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const DEST=[
  {id:'recipes',href:'/',label:'Recetas',icon:'chef'},
  {id:'plan',href:'/plan',label:'Plan',icon:'cal'},
  {id:'ingredients',href:'/ingredients',label:'Despensa',icon:'fridge'},
  {id:'profile',href:'/profile',label:'Perfil',icon:'user'}
];
const RECIPES=[
  {id:'ajiaco',t:'Ajiaco santafereño',c:'Sopas · 90 min',e:'🍲',col:'--cat-soups'},
  {id:'tortilla',t:'Tortilla de patatas',c:'Principales · 40 min',e:'🍳',col:'--cat-mains'},
  {id:'ensalada',t:'Ensalada de quinoa',c:'Ensaladas · 20 min',e:'🥗',col:'--cat-salads'},
  {id:'brownie',t:'Brownie de cacao',c:'Postres · 45 min',e:'🍫',col:'--cat-desserts'}
];
// Pure rule from PRD FR-2: current destination for an address
function current(path){ if(path==='/'||path.startsWith('/recipes/'))return 'recipes'; const d=DEST.find(d=>d.href!=='/'&&(path===d.href||path.startsWith(d.href+'/'))); return d?d.id:null; }
// Pure rule from PRD FR-6: sidebar state
function sidebarExpanded(stored,layout){ if(stored===true||stored===false)return stored; return layout==='large'; }

let path='/', view='auto', pref=null;
try{const v=localStorage.getItem('proto006.sidebar'); if(v==='1')pref=true; if(v==='0')pref=false;}catch(e){}
const $=s=>document.querySelector(s), frame=$('#frame'), app=$('#app');
const layoutOf=w=>w>=1280?'large':w>=640?'medium':'small';

function nav(href){path=href;render();}
function recipeId(){const m=path.match(/^\/recipes\/(.+)$/);return m?m[1]:null;}

function bottomNav(cur){
  return `<nav class="bottomnav" aria-label="Principal">${DEST.map(d=>`<a href="${d.href}" data-href="${d.href}" ${d.id===cur?'aria-current="page"':''}>${svg(d.icon,'nav')}<span>${d.label}</span></a>`).join('')}</nav>`;
}
function sideNav(cur,exp){
  return `<nav class="sidenav ${exp?'expanded':''}" aria-label="Principal">
    <div class="brand"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAAFVElEQVR4nO3dMXLbRhSA4aUmvQuP3aZJl95X8pl8Jffp0qS1RoVO4BQaemgKIAECu/uw7/vKFAYivH93QSrOqQTz6eOHn73vgXqeX15Pve/hUtebMeyU0jeK5hc29NzSOoZmFzP4rNEqhOoXMfhsUTuEan+4wWdPtULY/Q81+NS0dwhPe/5hhp/a9p6xXWoy+PSwx26weQcw/PSyx+xtCsDw09vWGXw4AMNPFFtm8aEADD/RPDqTqwMw/ET1yGyuCsDwE93aGV0cgOHnKNbM6qIADD9Hs3Rm7wZg+DmqJbO7669CwNHcDMDqz9Hdm+HZAAw/o7g1y45ApDYZgNWf0czNtB2A1N4FYPVnVFOzbQcgtd8CsPozuusZT78D/PfvP66V2K8AMq7+5yFpMSyjXuuILmf9NPUPRzc3GH/+9bdrJXH+D+pTHoFaDsSo1xrFUym5Vv+zqWGpdWQY9VpHdp75lDvALaO+qIpgWuoA5o4MNYZl1GsdXeoAShn3jO59YJn0AZQy7hnd+8B9p4wvwHOmhqPWSjrqtY7GDnDHqC+qdoI3Argw6ouql+J5Argy6ouqI880AUwY9UXVS/F7Alhh1DN65gh8CnTD5WDUPkKMeq3oBHDH9epYc2BGvVZkjkA3jHoMyXzkuSaAFUb91Cbr6l+KAGaNuiJb/X8ngIVGXZEzr/6lCCAVq/97ApiQ5UiSffUvRQCLjHAksfpPE0BSVv83Argy4vHH6j9PAHeMcPzpdZ0jEMAFq38+ArjB6j++P3rfQCSXw1F75Wx1rZb/Tkfkt0FJzRGI1ARAagIgNQGQmgBITQCkJgBS80VYB/5fXnHYARq79W2sb2rb801wI2uH227Qhh2A1ATQwCNHG8ehNgRQ2ZZBFkF9AiA1AZCaAEhNAKQmAFITQGVbvtDyZVh9AmjgkUE2/G10/VUIn3NTSt/Yu+0Ahp+znrPQJQDDz7VeM9E8AMPPnB6z4SWY1ARAagIgNQGQmgBITQCkJgBSEwCpNQ/AL3kxp8dsdNkBRMC1XjPR7QgkAs56zkLYvxnux9cvvW+BHX3+9r33LUwK+RJs+McT9ZmGCyDqD4rtIj7bcAFAS6ECiLhCsK9ozzhUANCaAEgtTADRtkbqifSswwQAPQiA1ARAagIgNQGQmgBITQCkJgBSEwCpCYDUBEBqAiA1AZCaAEhNAKQmAFITAKkJgNQEQGoCIDUBkJoASE0ApCYAUhMAqQmA1ARAagIgNQGQmgBITQCkJgBSEwCpCYDUBEBqAiA1AZCaAEhNAKQmAFILE8Dnb9973wKNRHrWYQKAHgRAaqECiLQ1Uke0ZxwqAGgtXADRVgj2E/HZhguglJg/KLaJ+kxDBlBK3B8Y60V+lmEDKCX2D45loj/D0AGUEv8HyLwjPLvTp48ffva+iaV+fP3S+xZY4AiDf3aoAC6JIZYjDf2lwwYAewj/DgA1CYDUnp5fXk+9bwJ6eH55PdkBSE0ApCYAUhMAqT2V8vYy0PtGoKXzzNsBSE0ApPYrAMcgsricdTsAqf0WgF2A0V3PuB2A1N4FYBdgVFOzbQcgtckA7AKMZm6m7QCkNhuAXYBR3JrlmzuACDi6ezPsCERqdwOwC3BUS2Z30Q4gAo5m6cwuPgKJgKNYM6ur3gFEQHRrZ3T1S7AIiOqR2XzoUyAREM2jM/nwx6AiIIots7jpewAR0NvWGdz8RZgI6GWP2dt1eP1V67Sw56K7669C2A2obe8ZqzawdgP2VGtxrb5iC4Etap8qmh1ZhMAarY7Tzc/sQuCW1u+RXV9axUApfT88CfepjSjGFu2Twv8BeGvtRukaFKkAAAAASUVORK5CYII=" alt="" width="32" height="32"><span>My Food</span></div>
    ${DEST.map(d=>`<a href="${d.href}" data-href="${d.href}" ${d.id===cur?'aria-current="page"':''} aria-label="${d.label}">${svg(d.icon,'nav')}<span class="lbl">${d.label}</span></a>`).join('')}
    <div class="grow"></div>
    <button class="toggle" id="toggle" aria-expanded="${exp}" aria-label="${exp?'Contraer menú':'Expandir menú'}">${svg(exp?'close':'open','nav')}<span class="lbl">${exp?'Contraer menú':'Expandir menú'}</span></button>
  </nav>`;
}
function listHtml(sel){
  return `<div class="shell"><h1>Recetas</h1><div class="badge"><i></i>Sincronizado hace 2 min</div>
    <ul class="list">${RECIPES.map(r=>`<li><button class="row" data-href="/recipes/${r.id}" ${sel===r.id?'aria-current="true"':''}><span class="thumb" style="background:color-mix(in srgb,var(${r.col}) 30%,var(--color-surface-2))">${r.e}</span><span><span class="t">${r.t}</span><br><span class="c">${r.c}</span></span></button></li>`).join('')}</ul>
    <p class="note">Prototipo: la lista, los filtros y la búsqueda reales no cambian; aquí solo se muestran filas de ejemplo.</p></div>`;
}
function detailHtml(r,closable){
  return `<article class="detail" aria-label="${r.t}"><div class="bar"><button class="iconbtn" data-close aria-label="Cerrar receta">${svg(closable==='back'?'back':'x')}</button><b>${r.t}</b></div>
    <div class="body"><div class="hero" style="background:color-mix(in srgb,var(${r.col}) 30%,var(--color-surface-2))">${r.e}</div>
    <h2>Ingredientes</h2><ul><li>Ingrediente de ejemplo</li><li>Ingrediente de ejemplo</li></ul><h2>Pasos</h2><p>Contenido de ejemplo del detalle.</p></div></article>`;
}
const SOON={plan:['Plan','cal'],ingredients:['Despensa','fridge'],profile:['Perfil','user']};
function soonHtml(id){const [n,ic]=SOON[id];return `<main class="soon"><div><div class="ic">${svg(ic)}</div><h1>${n}</h1><p>Próximamente</p></div></main>`;}

function render(){
  const w=frame.clientWidth, layout=layoutOf(w), cur=current(path), rid=recipeId(), r=RECIPES.find(x=>x.id===rid);
  const exp=sidebarExpanded(pref,layout);
  $('#addr').textContent=path; $('#info').textContent=`Ancho ${Math.round(w)} px · ${layout}${layout!=='small'?' · menú '+(exp?'expandido':'colapsado'):''}`;
  document.title=(cur&&DEST.find(d=>d.id===cur).label+' · ')+'My Food';
  let main='';
  if(cur===null){main=`<main class="soon"><div><h1>404</h1><p>Esta página no existe.</p></div></main>`;}
  else if(cur==='recipes'){
    if(layout==='large'){main=`<div class="listcol scroll">${listHtml(rid)}</div><div class="panel">${r?detailHtml(r,'x'):'<div class="empty"><p>Elige una receta de la lista.</p></div>'}</div>`;}
    else main=`<div class="scroll" style="${layout==='small'?'padding-bottom:64px':''}">${listHtml(rid)}</div>`;
  } else main=`<div class="scroll" style="${layout==='small'?'padding-bottom:64px':''}">${soonHtml(cur)}</div>`;
  let layer='';
  if(r&&layout==='small')layer=`<div class="layer full">${detailHtml(r,'back')}</div>`;
  if(r&&layout==='medium')layer=`<div class="layer modal" data-scrim>${detailHtml(r,'x')}</div>`;
  const bar=layout==='small'&&!(r&&cur==='recipes')?bottomNav(cur):'';
  app.className='app '+layout;
  app.innerHTML=(layout!=='small'?sideNav(cur,exp):'')+`<div class="content">${main}${layer}${bar}</div>`;
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-href]'); if(a){e.preventDefault();nav(a.dataset.href);return;}
  if(e.target.closest('[data-close]')){nav('/');return;}
  if(e.target.matches('[data-scrim]')){nav('/');return;}
  if(e.target.closest('#toggle')){const layout=layoutOf(frame.clientWidth);pref=!sidebarExpanded(pref,layout);try{localStorage.setItem('proto006.sidebar',pref?'1':'0')}catch(_){}render();}
});
$('#resetpref').onclick=()=>{pref=null;try{localStorage.removeItem('proto006.sidebar')}catch(_){}render();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&recipeId()&&layoutOf(frame.clientWidth)!=='small')nav('/');});

const VIEWS=[['auto','Automática'],['phone','Móvil 390'],['medium','Mediana 820'],['large','Grande 1280']];
$('#views').innerHTML=VIEWS.map(([k,l])=>`<button data-view="${k}" aria-pressed="${k===view}">${l}</button>`).join('');
$('#views').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;
  $('#views').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===view));
  frame.className='frame'+(view==='auto'?'':' fixed'+(view==='phone'?' phone':''));
  frame.style.width=({auto:'100%',phone:'390px',medium:'820px',large:'1280px'})[view]; frame.style.maxWidth=view==='auto'?'100%':'none'; render();};
const T=[['dark','Oscuro'],['light','Claro']];
$('#themes').innerHTML=T.map(([k,l])=>`<button data-t="${k}" aria-pressed="${k==='dark'}">${l}</button>`).join('');
