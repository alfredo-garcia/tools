# Reserva automática de clases Smart. Ver apps/smart-english-class-booking/README.md
name: Smart English class booking

on:
  schedule:
    # 05:40 Bogotá (10:40 UTC) lunes y miércoles. El script espera hasta las 06:00:00.
    # Se arranca antes porque el cron de GitHub puede retrasarse varios minutos.
    - cron: "40 10 * * 1,3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = todo menos Confirmar"
        default: "1"
      target_date:
        description: "Forzar día dd/mm/yy (vacío = mañana)"
        default: ""

concurrency:
  group: smart-english-class-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/smart-english-class-booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/smart-english-class-booking/requirements.txt
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Reservar
        env:
          SMART_USER: ${{ secrets.SMART_USER }}
          SMART_PASS: ${{ secrets.SMART_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # En schedule no hay inputs: ambos quedan vacíos / '0'.
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          TARGET_DATE: ${{ inputs.target_date }}
          WAIT_UNTIL: ${{ github.event_name == 'schedule' && '06:00' || '' }}
          SHOTS_DIR: shots
        run: python booker.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/smart-english-class-booking/shots/*.png
          if-no-files-found: ignore
          retention-days: 7
